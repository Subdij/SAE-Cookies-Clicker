<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/classement.css">
    <link rel="stylesheet" href="https://use.typekit.net/dda2fdp.css%22%3E">
    <title>Classement | Stars Clicker</title>
</head>
<body>
    <img id="planete" src="./images/jupiter.png">
    <div id="fermer"><img id="croi" src="./ressources/image/croix.png" alt="bords"></a></div>
    
    <div id="main">

        <img id="fond" src="./images/fond.jpg">

        <div id="podium">   
            <div class='case-podium' id="rectangle-gris">
                <p>2</p>
                <p>Subdij</p>
            </div>
            <div class='case-podium' id="rectangle-jaune">
                <p>1</p>
                <p>Corentin geek</p>
            </div>
            <div class='case-podium' id="rectangle-maron">
                <p>3</p>
                <p>Orlane</p>
            </div>
        </div>

        <div class="fond_classement">
            <h1>Classement</h1>
            <div id="rectancle_jaune">
                <p id="p1">1 - Corentin geek</p>
                <p id="p2">SCORE : 8041010101010111000</p>
            </div>
            <div id="rectancle_gris">
                <p id="p1">2 - subdij</p>
                <p id="p2">SCORE : 4041010101010111000</p>
            </div>
            <div id="rectancle_maron">
                <p id="p1">3 - Orlane</p>
                <p id="p2">SCORE : 2041010101010111000</p>
            </div>
            <div id="rectancle_osef">
            </div>

            <div id="footer">
                <div id="block"><img src="./ressources/image/bt1.png"></div>
                <div id="block"><img src="./ressources/image/bt2.png"></div>
                <div id="block"><img src="./ressources/image/bt3.png"></div>
                <div id="block"><img src="./ressources/image/bt4.png"></div>
            </div>

        </div>
        <div id="barre1"></div>
        <div id="barre2"></div>
        <div id="barre3"></div>
        <div id="barre4"></div>
        <div id="barre5"></div>

    </div>
    
    <script>
        var xhr = new XMLHttpRequest();
        xhr.onreadystatechange = function() {
            if (xhr.readyState == XMLHttpRequest.DONE) {
            var data = JSON.parse(xhr.responseText);
            for (var i = 0; i < data.length; i++) {
                var div = document.createElement('div');
                div.classList.add('rectangle_rank');
                div.innerHTML = '<p id="p1">' + (i + 1) + ' - ' + data[i].username + '</p><p id="p2">SCORE : ' + data[i].score + '</p>';
                document.getElementById('rectancle_osef').appendChild(div);
            }
            }
        }
        xhr.open('GET', 'https://sae-301.azurewebsites.net/get-leaderboard.php', true);
        xhr.send(null);
    </script>            


</body>
</html>
