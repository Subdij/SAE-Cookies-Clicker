<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stars Clicker</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="icon" href="ressources/image/icon.png">
    <link href="https : //fonts.googleapis.com/css2?family= Monda: wght @700 & display=swap" rel="stylesheet">
</head>
<body>
    <section class="grid1">
        <div class="position-planet">
            <img src="ressources/image/terre.png" alt="image de la Terre" id="terre">
        </div>
        <div class="position-title">
            <h1>Stars Clicker</h1>
        </div>
        <div class="position-fusee">
            <img src="ressources/image/fusee.png" alt="image d'une fusée" id="fusee">
        </div>
        </section>
        <section class="grid2">
            <div class="position-fusee">
                <img src="ressources/image/fusee.png" alt="image d'une fusée" id="fusee"  style="transform : rotate(90deg);">
            </div>
            <div class="position-formulaire">
                    <p>Démarrez votre aventure en inscrivant votre pseudo !</p>
                    <div class="form">
                        <input type="text" class="form-control" id="username" placeholder="Username" required autocomplete="off">
                    </div>
                    <div class="button-center">
                        <button onclick="pseudo()">Commencer</button>
                    </div>
            </div>
            <div class="position-planet">
                <img src="ressources/image/lune.png" alt="image de la Lune" id="lune">
            </div>
        </section>
    </div>
    <script src="js/conn.js"></script>
</body>
</html>
